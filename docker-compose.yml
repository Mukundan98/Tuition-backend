services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tuition_backend
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "Tuvo Backend"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://api.yourdomain.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://tuition-frontend.pages.dev}
      RUN_MIGRATIONS: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-tuition_management}
      DB_USERNAME: ${DB_USERNAME:-tuition_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret_db_password}
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tuition_network

  db:
    image: mysql:8.0
    container_name: tuition_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-tuition_management}
      MYSQL_USER: ${DB_USERNAME:-tuition_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_db_password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tuition_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional Cloudflare Tunnel:
  # Allows your backend to connect directly to Cloudflare without opening public router ports.
  # Set CLOUDFLARE_TUNNEL_TOKEN in .env to enable.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tuition_cloudflare_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - tuition_network
    profiles:
      - tunnel

networks:
  tuition_network:
    driver: bridge

volumes:
  mysql_data:
